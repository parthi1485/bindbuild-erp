<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tasks · Bind Build ERP</title>
<link rel="stylesheet" href="/src/styles/app.css"/>
<link rel="stylesheet" href="/src/styles/tasks.css"/>
<script>(function(){var s=localStorage.getItem('bindbuild.theme');var l=matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.setAttribute('data-theme',s||(l?'light':'dark'));})();</script>
</head>
<body><div class="app" id="app"><div class="scrim" id="scrim"></div><div class="main" id="main">
<main class="content" id="content">
<section class="page-head">
  <div><h1 class="page-head__title">Task Board</h1><p class="page-head__sub">Project actions, owners and deadlines · live across the team</p></div>
  <div class="page-head__acts"><button class="btn-ghost" id="calendarBtn">Calendar</button><button class="btn-new" id="addBtn">+ Add task</button></div>
</section>
<section class="toolbar">
  <select class="sel" id="projFilter" aria-label="Project"><option value="">All projects</option></select>
  <select class="sel" id="assigneeFilter" aria-label="Assignee"><option value="">All assignees</option><option value="unassigned">Unassigned</option></select>
  <div class="seg" id="prioSeg"><button class="on" data-prio="">All</button><button data-prio="high"><span class="pd hi"></span>High</button><button data-prio="medium"><span class="pd me"></span>Medium</button><button data-prio="low"><span class="pd lo"></span>Low</button></div>
  <span class="toolbar__sp"></span><button class="clear-btn" id="clearBtn">Clear filters</button>
</section>
<div class="board" id="board" aria-label="Task status board"></div>
</main>
<footer class="footer"><span>© 2026 Studio Bind Architects · Chennai</span><span class="footer__status"><span class="dot"></span><span id="taskFoot">Live task queue</span></span><span class="ver-tag">Bind Build ERP</span></footer>
</div></div>

<div class="modal-root" id="modalRoot" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="scrim" data-close style="position:absolute;opacity:1;pointer-events:auto"></div>
  <div class="modal">
    <div class="modal__head"><span class="modal__title" id="modalTitle">New task</span><button class="modal__x" data-close aria-label="Close">×</button></div>
    <div class="modal__body">
      <div class="field"><label for="mTitle">Task title</label><input id="mTitle" placeholder="What needs to happen?"/></div>
      <div class="field"><label for="mDesc">Details</label><textarea id="mDesc" placeholder="Optional context, deliverable or instruction"></textarea></div>
      <div class="field"><label for="mProj">Project</label><select id="mProj"><option value="">General / no project</option></select></div>
      <div class="field-row"><div class="field"><label for="mAssignee">Assignee</label><select id="mAssignee"><option value="">Unassigned</option></select></div><div class="field"><label for="mPrio">Priority</label><select id="mPrio"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select></div></div>
      <div class="field-row"><div class="field"><label for="mDue">Due date</label><input id="mDue" type="date"/></div><div class="field"><label for="mStatus">Status</label><select id="mStatus"><option value="backlog">Backlog</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="review">Review</option><option value="done">Done</option></select></div></div>
      <div class="modal__foot"><button class="btn-ghost" data-close>Cancel</button><button class="btn-new" id="saveTask">Save task</button></div>
    </div>
  </div>
</div>
<div class="toast-region" aria-live="polite"></div><script type="module" src="/src/pages/tasks.js"></script></body></html>

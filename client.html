<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clients · Bind Build ERP</title>
<link rel="stylesheet" href="/src/styles/app.css"/>
<link rel="stylesheet" href="/src/styles/client.css"/>
<script>(function(){var s=localStorage.getItem('bindbuild.theme');var l=matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.setAttribute('data-theme',s||(l?'light':'dark'));})();</script>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <div class="main" id="main">
    <main class="content" id="content">
      <section class="page-head">
        <div>
          <h1 class="page-head__title" id="pageTitle">Clients</h1>
          <p class="page-head__sub" id="pageSub">Converted clients and their projects, invoices and receipts</p>
        </div>
        <div class="page-head__acts">
          <button class="btn-ghost" id="listBtn">All clients</button>
          <button class="btn-ghost" id="editBtn" hidden>Edit billing details</button>
        </div>
      </section>

      <section id="clientList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--s-4)"></section>

      <section id="profile" hidden>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:var(--s-5);align-items:start">
          <div style="display:flex;flex-direction:column;gap:var(--s-5)">
            <article class="card" style="padding:var(--s-5)">
              <div style="display:flex;gap:14px;align-items:center">
                <div class="avatar" id="clientAvatar">CL</div>
                <div><h2 id="clientName" style="font-family:var(--font-display);font-size:22px"></h2><p id="clientMeta" style="color:var(--text-3);margin-top:4px"></p></div>
              </div>
            </article>

            <article class="card" style="padding:var(--s-5)">
              <h2 class="card__title">Projects</h2>
              <div id="projects" style="margin-top:var(--s-4)"></div>
            </article>

            <article class="card" style="padding:var(--s-5)">
              <h2 class="card__title">Commercial ledger</h2>
              <div id="ledger" style="margin-top:var(--s-4);overflow:auto"></div>
            </article>
          </div>

          <aside style="display:flex;flex-direction:column;gap:var(--s-5)">
            <article class="card" style="padding:var(--s-5)">
              <h2 class="card__title">Contact & billing</h2>
              <div class="kv"><span class="kv__k">Phone</span><span class="kv__v" id="phone">—</span></div>
              <div class="kv"><span class="kv__k">Email</span><span class="kv__v" id="email">—</span></div>
              <div class="kv"><span class="kv__k">Address</span><span class="kv__v" id="address">—</span></div>
              <div class="kv"><span class="kv__k">State</span><span class="kv__v" id="state">—</span></div>
              <div class="kv"><span class="kv__k">GSTIN</span><span class="kv__v" id="gstin">—</span></div>
              <div class="kv"><span class="kv__k">PAN</span><span class="kv__v" id="pan">—</span></div>
            </article>

            <article class="card" style="padding:var(--s-5)">
              <h2 class="card__title">Collections</h2>
              <div style="font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:10px" id="collected">₹0</div>
              <p style="color:var(--text-3);margin-top:5px" id="outstanding">—</p>
            </article>
          </aside>
        </div>
      </section>
    </main>
    <footer class="footer"><span>© 2026 Studio Bind Architects · Chennai</span><span>Bind Build ERP</span></footer>
  </div>
</div>
<div class="toast-region" aria-live="polite"></div>
<script type="module" src="/src/pages/client.js"></script>
</body>
</html>
